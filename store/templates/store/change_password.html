{% extends 'base.html' %}
{% load static %}
{% block title %}
<title>Change Password | Break Digital Barriers</title>
{% endblock %}

{% block content %}
<style>
    .my-profile {
        margin: 5rem 0;
        padding: 0 10rem;
    }

    .form-control {
        font-size: 14px;
        border: none;
        border-bottom: 1px solid #000000;
        border-radius: 0;
        padding-left: 0rem;
        outline: none;
        transition: all 0.3s ease;
    }

    .form-control::placeholder {
        font-size: 15px;
    }

    .form-control:focus {
        outline: none;
        box-shadow: 0 0 8px rgba(179, 3, 255, 0.5);
        /* soft glow */
        border-radius: 5px;
        padding-left: 1rem;
        border: none;
        border-bottom: 1px solid transparent;
    }

    button[type="submit"] {
        background: linear-gradient(135deg, #bb30f6, #000000);
        border: none;
        transition: all 0.5s ease;
        margin-top: 1rem;
    }

    button[type="submit"]:hover {
        border: none;
        background: linear-gradient(135deg, #000000, #bb30f6);
    }

    @media (max-width: 768px) {
        .my-profile {
            padding: 0;
            margin-top: 7rem;
        }
    }

    @media (max-width: 767.98px) {
        .my-profile {
            padding: 0 2rem;
            margin-top: 7rem;
        }

    }
</style>
<main class="index-main">
    <section class="sim-store-navbar" data-aos="fade-down">
        <div class="container-fluid d-flex flex-column gap-4">
            <div class="sim-store-header">
                <h2>Change Password</h2>
            </div>
            <div class="mini-navbar d-flex align-items-center gap-3">
                <a href="/">
                    <span>Home</span>
                </a>
                <i class="fa-solid fa-angle-right fa-xs"></i>
                <span class="active">Change password</span>
            </div>
        </div>
    </section>
    <section class="my-profile">
        <div class="container">
            <div class="card shadow border-0 mx-auto mt-4 p-4" style="max-width: 400px;">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="text-center mb-5">
                        <i class="fa-solid fa-key fa-2xl" style="color: #800bce;"></i>
                    </div>
                    <div class="mb-5">
                        <div class="position-relative">
                            <label for="">Current password</label>
                            <input type="password" class="form-control pe-5" name="current_password"
                                id="current_password" required>
                            <span
                                class="position-absolute top-50 end-0  m-auto text-muted toggle-password"
                                style="cursor: pointer;">
                                <i id="togglePassword" class="bi bi-eye"></i>
                            </span>
                        </div>
                    </div>
                    <div class="mb-5">
                        <div class="position-relative">
                            <label for="">New password</label>
                            <input type="password" class="form-control pe-5" name="new_password" id="new_password"
                                required minlength="6" oninput="validatePassword()">
                            <span
                                class="position-absolute top-50 end-0 m-auto text-muted toggle-password"
                                style="cursor: pointer;">
                                <i id="toggleNewPassword" class="bi bi-eye"></i>
                            </span>
                        </div>
                        <div>
                            <span style="font-size: 12px;" id="message"></span>
                        </div>
                    </div>
                    <div class="mb-5">
                        <div class="position-relative">
                            <label for="">Confirm new password</label>
                            <input type="password" class="form-control pe-5" name="new_password2" id="new_password2"
                                required minlength="6" oninput="passwordMatch()">
                            <span
                                class="position-absolute top-50 end-0 m-auto text-muted toggle-password"
                                style="cursor: pointer;">
                                <i id="toggleConfirmPassword" class="bi bi-eye"></i>
                            </span>
                        </div>
                        <div>
                            <span style="font-size: 12px;" id="message-2"></span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>
            </div>
        </div>

    </section>
</main>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script>
    // Toggle password visibility for all toggle-password spans
    document.querySelectorAll('.toggle-password').forEach(function (toggle) {
        toggle.addEventListener('click', function () {
            const icon = this.querySelector('i');
            const input = this.previousElementSibling; // gets the input before the toggle span

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    });

    function passwordMatch() {
        let password = document.getElementById('new_password').value;
        let confirmPassword = document.getElementById('new_password2').value;
        if (password === confirmPassword) {
            document.getElementById('message-2').style.color = 'green';
            document.getElementById('message-2').innerHTML = 'Passwords match';
        } else {
            document.getElementById('message-2').style.color = 'red';
            document.getElementById('message-2').innerHTML = 'Passwords do not match';
        }
    }

    function validatePassword() {
        let password = document.getElementById("new_password").value;
        let message = document.getElementById("message");

        if (password.length >= 6) {
            message.style.color = "green";
            message.textContent = "Password is strong!";
        } else {
            message.style.color = "red";
            message.textContent = "Password must be at least 6 characters long.";
        }
    }
</script>

{% endblock %}
