{% extends 'base_2.html' %}
{% block content %}


<style>
    input[type="text"],
    input[type="tel"],
    input[type="email"] {
        border-radius: 1rem;
        padding-left: 1rem;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus {
        outline: none;
        box-shadow: 0 0 8px rgba(179, 3, 255, 0.5);
        /* soft glow */
        border-radius: 5px;
        padding-left: 1rem;
        border: none;
        border-bottom: 1px solid transparent;
    }

    label {
        font-size: 15px;
        margin-left: 0.75rem;
    }


    .checkout-wrapper {
        border-radius: 1rem;
    }

    .pay-btn {
        background: linear-gradient(to right, #bb30f6, #000000);
        transition: all 0.3s ease-in-out;
        padding: 0.6rem 5rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: white;
        border: none;
        border-radius: 2rem;
    }

    .pay-btn:hover {
        background: linear-gradient(to right, #8523ae, #7800ac);
    }

    small {
        font-weight: 600;
    }
</style>
<div class="container p-5">
    <div class="row bg-light checkout-wrapper">
        <div class="p-3">
            <a href="{% url 'orders:checkout' %}" class="text-decoration-none">
                <i class="fa-solid fa-angle-left fa-sm" style="color: #8523ae;"></i>
                <span style="color: #8523ae; font-size: 17px; font-weight: 500; ">Back</span>
            </a>
        </div>
        <!-- Customer Info Form -->
        <div class="col-md-7 p-5 pt-3">
            <div class="container mt-4">
                <div class="d-flex align-items-center gap-2 mb-5">
                    <i class="fa-solid fa-truck-fast fa-lg"></i>
                    <h4 class="m-0 p-0">Delivery Method</h4>
                </div>
                <form method="post" action="{% url 'orders:shipping_method' %}">
                    {% csrf_token %}

                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="shipping_method" value="standard" checked>
                        <label class="form-check-label">Standard Delivery (<small>within 7 working days</small>)</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="shipping_method" value="express">
                        <label class="form-check-label">Express Delivery
                            (<small>within 48hrs. ₦10,000</small>)</label>
                    </div>

                    <div class="text-start">
                        <button type="submit" class="btn btn-success pay-btn mt-4">Next</button>
                    </div>
                </form>

            </div>
        </div>

        <!-- Order Summary -->
        <!-- <div class="col-md-5 mt-5 mt-md-0 p-5 order-summary">
            <h5 class="mb-4 text-white">Order Summary</h5>

                    <strong>Total</strong>
                    ------------
                    <strong>${{ cart_total|floatformat:2 }}</strong>
                </li>
            </ul>
        </div> -->
    </div>
</div>
{% endblock %}
