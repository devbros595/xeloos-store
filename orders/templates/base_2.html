{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    {% endblock %}
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'store/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'store/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'store/favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'store/favicon/site.webmanifest' %}">
    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js"
        integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+"
        crossorigin="anonymous"></script>

    <style>
        * {
            font-family: Poppins;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            background-color: #ffffff;
        }

        #preloader {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            top: 0;
            left: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #preloader-logo {
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
            box-shadow: 0 5px 20px 0 rgba(0, 0, 0, 0.25);
        }

        .navbar {
            width: 100%;
            padding-right: 10px;
        }

        .navbar-container {
            width: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 0;
            position: relative;
        }

        .navbar-logo {
            margin-left: 4rem;
        }

        .navbar-logo img {
            height: 50px;
            width: 50px;
            image-rendering: optimizeQuality;
        }

        /* Mobile styles */
        @media (min-width: 320px) and (max-width: 1024px) {
            .navbar-container {
                justify-content: start;
            }
        }
    </style>
</head>

<body>
    <div id="preloader" style="display: none;">
        <div class="loader-wrapper text-center">
            <img id="preloader-logo" src="{% static 'store/img/Xeloos_logo_black.jpg' %}" alt="Logo"
                style="width: 80px; margin-bottom: 1rem;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
    <header class="header">
        <nav class="navbar bg-white">
            <div class="navbar-container">
                <div class="navbar-logo">
                    <img src="{% static 'cart/Xeloos_logo_white.jpg' %}" alt="">
                </div>
            </div>
        </nav>
    </header>
    <section>
        <style>
            .message-container {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                position: fixed;
                left: 10rem;
                top: 15rem;
                transform: translate(-50%, 50%);
            }

            .message-content {
                padding: 10px;
                background: #f8f9fa;
                padding: 10px;
                border-radius: 8px;
                font-weight: 500;
                font-size: 14px;
            }

            @media (min-width: 320px) and (max-width: 1024px) {
                .message-container {
                    position: relative;
                    z-index: 100;
                    left: 17rem;
                    top: 10rem;
                    transform: translate(-50%, 50%);
                }
            }
        </style>


        {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="message-content {% if 'error' in message.tags %}text-danger{% else %}text-success{% endif %}">
                <i
                    class="fas {% if 'error' in message.tags %}fa-exclamation-circle text-danger{% else %}fa-check-circle text-success{% endif %} me-2"></i>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </section>

    {% block content %}
    {% endblock %}


    <footer class="footer">
        <style>
            .footer {
                position: relative;
                z-index: 1;
                overflow: hidden;
            }

            @media (min-width: 1025px) {
                .footer {
                    border-radius: 0;
                    padding: 4rem 0px 0px;
                }
            }

            .footer-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
            }


            .footer-container hr {
                border: none;
                border-top: 1px solid #7b7b7b;
                width: 40%;
                height: 0;
            }

            .footer-copyright {
                font-size: 12px;
                color: rgba(0, 0, 0, .8);
                opacity: 0.4;
                text-align: center;
                padding: 0rem 0 1.5rem
            }
        </style>
        <div class="footer-container">
            <hr>
            <div class="footer-copyright">© 2025 Xeloos | All rights reserved.</div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const preloader = document.getElementById('preloader');

            function showPreloaderThenNavigate(e, url) {
                e.preventDefault();
                preloader.style.display = 'flex';

                setTimeout(() => {
                    window.location.href = url;
                }, 1500);
            }

            // Intercept link clicks
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href && href !== '#' && !href.startsWith('javascript') && !this.hasAttribute('target')) {
                        showPreloaderThenNavigate(e, href);
                    }
                });
            });

            // Intercept form submits
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    preloader.style.display = 'flex';

                    setTimeout(() => {
                        form.submit();  // allow actual form submission after 3s
                    }, 1000);
                });
            });
        });
    </script>

</body>

</html>
