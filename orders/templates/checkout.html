{% extends 'base_2.html' %}
{% load static %}

{% block content %}
<style>
    input[type="text"],
    input[type="tel"],
    input[type="email"] {
        border-radius: 1rem;
        padding-left: 1rem;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus {
        outline: none;
        box-shadow: 0 0 8px rgba(179, 3, 255, 0.5);
        /* soft glow */
        border-radius: 5px;
        padding-left: 1rem;
        border: none;
        border-bottom: 1px solid transparent;
    }

    label {
        font-size: 15px;
        margin-left: 0.75rem;
    }


    .checkout-wrapper {
        border-radius: 1rem;
    }

    .pay-btn {
        background: linear-gradient(to right, #bb30f6, #000000);
        transition: all 0.3s ease-in-out;
        padding: 0.6rem 5rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: white;
        border: none;
        border-radius: 2rem;
    }

    .pay-btn:hover {
        background: linear-gradient(to right, #8523ae, #7800ac);
    }
</style>
<div class="container p-5">
    <div class="row bg-light checkout-wrapper">
        <div class="p-3">
            <a href="{% url 'store-category' %}" class="text-decoration-none">
                <i class="fa-solid fa-angle-left fa-sm" style="color: #8523ae;"></i>
                <span style="color: #8523ae; font-size: 17px; font-weight: 500; ">Back to store</span>
            </a>
        </div>
        <!-- Customer Info Form -->
        <div class="col-md-7 p-5 pt-3">
            <h4 class="mb-4">Shipping Information</h4>

            <form method="post" action="{% url 'orders:checkout' %}" class="mt-5">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ initial_data.name }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ initial_data.email }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" name="phone" value="{{ initial_data.phone }}"
                        required>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" name="address"
                        value="{{ initial_data.address }}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" name="city" value="{{ initial_data.city }}"
                            required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="state" class="form-label">State</label>
                        <input type="text" class="form-control" id="state" name="state" value="{{ initial_data.state }}"
                            required>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success pay-btn mt-4">Continue</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
